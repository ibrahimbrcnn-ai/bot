<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMSPark Destek Chatbotu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            padding: 12px;
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .loading.active {
            display: block;
        }

        .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 4px;
        }

        .whatsapp-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #25D366;
            color: white;
            padding: 15px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 1000;
            font-size: 16px;
        }

        .whatsapp-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-button:active {
            transform: translateY(0);
        }

        .whatsapp-icon {
            font-size: 24px;
        }

        .whatsapp-link-in-message {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .whatsapp-link-in-message:hover {
            background: #20BA5A;
        }
    </style>
</head>
<body>
    <a href="https://wa.me/905437265986" target="_blank" class="whatsapp-button">
        <span class="whatsapp-icon">💬</span>
        <span>WhatsApp Destek</span>
    </a>

    <div class="chat-container">
        <div class="chat-header">
            🤖 SMSPark Destek Chatbotu
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-bubble">
                    Merhaba! SMSPark destek ekibine hoş geldiniz. Size nasıl yardımcı olabilirim? Sorununuzu açıklayabilirsiniz.
                    <div class="timestamp">Şimdi</div>
                </div>
            </div>
        </div>
        <div class="loading" id="loading">Chatbot yazıyor...</div>
        <div class="chat-input-container">
            <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." />
            <button id="sendButton" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const loading = document.getElementById('loading');

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            // Mesaj içinde WhatsApp yönlendirmesi varsa link ekle
            if (text.includes('WhatsApp') && text.includes('05437265986') && !isUser) {
                bubble.innerHTML = text.replace(/\n/g, '<br>');
                
                // WhatsApp butonu ekle
                const whatsappLink = document.createElement('a');
                whatsappLink.href = 'https://wa.me/905437265986';
                whatsappLink.target = '_blank';
                whatsappLink.className = 'whatsapp-link-in-message';
                whatsappLink.textContent = '💬 WhatsApp Destek Hattına Git';
                bubble.appendChild(whatsappLink);
            } else {
                bubble.innerHTML = text.replace(/\n/g, '<br>');
            }
            
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            
            bubble.appendChild(timestamp);
            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            messageInput.value = '';
            sendButton.disabled = true;
            loading.classList.add('active');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (data.status === 'success') {
                    setTimeout(() => {
                        addMessage(data.response, false);
                        loading.classList.remove('active');
                        sendButton.disabled = false;
                    }, 500); // Kısa bir gecikme ile daha doğal görünüm
                } else {
                    throw new Error(data.error || 'Bir hata oluştu');
                }
            } catch (error) {
                addMessage('Üzgünüm, bir hata oluştu. Lütfen tekrar deneyin.', false);
                loading.classList.remove('active');
                sendButton.disabled = false;
            }
        }
    </script>
</body>
</html>
